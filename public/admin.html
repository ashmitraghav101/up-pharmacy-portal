<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#172b3a}.top{background:#083b59;color:#fff;padding:18px 5%}.wrap{max-width:1000px;margin:auto}.panel{background:#fff;margin:30px auto;padding:28px;border-radius:16px;border:1px solid #dce5ec}.login{max-width:420px}label{font-size:12px;font-weight:bold;display:block;margin:12px 0 6px}input{width:100%;padding:11px;border:1px solid #ccd8e1;border-radius:7px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr auto;gap:7px;margin:8px 0}.row input{padding:9px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#0b6fae;color:#fff}.secondary{background:#eaf0f4}.danger{background:#feeceb;color:#a52a22}.msg{color:#087f5b;font-weight:bold;display:none}.error{color:#b42318;display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.full{grid-column:auto}}
</style></head><body>
<div class="top"><div class="wrap"><b>✚ Pharmacy Administration</b></div></div><div class="wrap">
<div class="panel login" id="login"><h2>Admin Login</h2><p style="color:#667085">Private area for the pharmacy administrator.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><p class="error" id="err">Invalid login details.</p><button class="btn primary" onclick="signin()">Sign In</button></div>
<div class="panel" id="dash" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2>Manage Pharmacy</h2><p style="color:#667085">Changes here are published to the public website.</p></div><button class="btn secondary" onclick="logout()">Log out</button></div>
<div class="grid"><div><label>Pharmacy Name</label><input id="name"></div><div><label>Drug Licence Number</label><input id="license"></div><div><label>Licence Holder</label><input id="holder"></div><div><label>Premises Address</label><input id="address"></div><div><label>Pharmacist Name</label><input id="pharmacist"></div><div><label>Registration Number</label><input id="registration"></div></div>
<hr style="margin:28px 0;border:0;border-top:1px solid #e2e8ee"><h3>Weekly Medicine Stock</h3><div id="rows"></div><button class="btn secondary" onclick="addRow()">+ Add Medicine</button><br><br><button class="btn primary" onclick="save()">Save & Publish</button> <span class="msg" id="ok">Published successfully ✓</span></div>
</div>
<script>
let data;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/"/g,"&quot;");
async function signin(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});if(!r.ok){$("err").style.display="block";return}$("err").style.display="none";await openDash()}
async function openDash(){let r=await fetch("/api/admin/data");if(!r.ok)return;data=await r.json();$("login").style.display="none";$("dash").style.display="block";$("name").value=data.name;$("license").value=data.license;$("holder").value=data.holder;$("address").value=data.address;$("pharmacist").value=data.pharmacist;$("registration").value=data.registration;$("rows").innerHTML="";data.medicines.forEach(addRow)}
function addRow(m={name:"",generic_name:"",manufacturer:"",stock:"In Stock",purchase_price:"",consumer_price:""}){let r=document.createElement("div");r.className="row";[m.name,m.generic_name,m.manufacturer,m.stock,m.purchase_price,m.consumer_price].forEach((v,i)=>{let x=document.createElement("input");x.value=v||"";x.placeholder=["Brand / Medicine","Generic Name","Manufacturer","Stock","Purchase Price","Consumer Price"][i];r.appendChild(x)});let b=document.createElement("button");b.className="btn danger";b.textContent="Remove";b.onclick=()=>r.remove();r.appendChild(b);$("rows").appendChild(r)}
async function save(){let medicines=[...document.querySelectorAll(".row")].map(r=>{let x=r.querySelectorAll("input");return{name:x[0].value,generic_name:x[1].value,manufacturer:x[2].value,stock:x[3].value,purchase_price:x[4].value,consumer_price:x[5].value}});let body={name:$("name").value,license:$("license").value,holder:$("holder").value,address:$("address").value,pharmacist:$("pharmacist").value,registration:$("registration").value,medicines};let r=await fetch("/api/admin/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok){$("ok").style.display="inline";setTimeout(()=>$("ok").style.display="none",2500)}else alert("Could not save changes.")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
fetch("/api/me").then(r=>r.json()).then(x=>{if(x.authenticated)openDash()})
</script></body></html>
