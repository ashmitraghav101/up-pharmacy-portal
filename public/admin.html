<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Admin</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7fa;color:#172b3a}.top{background:#083b59;color:#fff;padding:18px 5%}.wrap{max-width:1000px;margin:auto}.panel{background:#fff;margin:30px auto;padding:28px;border-radius:15px;border:1px solid #dce5ec}.login{max-width:420px}label{font-size:12px;font-weight:bold;display:block;margin:12px 0 6px}input{width:100%;padding:11px;border:1px solid #ccd8e1;border-radius:7px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr auto;gap:7px;margin:8px 0}.row input{padding:9px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#0b6fae;color:#fff}.secondary{background:#eaf0f4}.danger{background:#feeceb;color:#a52a22}.msg{color:#087f5b;font-weight:bold;display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><div class="wrap"><b>✚ Pharmacy Administration</b></div></div><div class="wrap">
<div class="panel login" id="login"><h2>Admin Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><p id="error" style="color:#b42318;display:none">Invalid login.</p><button class="btn primary" onclick="signin()">Sign In</button></div>
<div class="panel" id="dash" style="display:none"><button class="btn secondary" style="float:right" onclick="logout()">Log out</button><h2>Manage Pharmacy</h2><p>Changes here are published to the public website.</p><div class="grid">
<div><label>Pharmacy Name</label><input id="name"></div><div><label>Drug Licence Number</label><input id="license"></div><div><label>Licence Holder</label><input id="holder"></div><div><label>Premises Address</label><input id="address"></div><div><label>Pharmacist Name</label><input id="pharmacist"></div><div><label>Registration Number</label><input id="registration"></div></div>
<hr style="margin:25px 0;border:0;border-top:1px solid #ddd"><h3>Weekly Medicine Stock</h3><div id="rows"></div><button class="btn secondary" onclick="addRow()">+ Add Medicine</button><br><br><button class="btn primary" onclick="save()">Save & Publish</button> <span id="ok" class="msg">Published ✓</span></div></div>
<script>
const $=x=>document.getElementById(x);let data;
async function signin(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});if(!r.ok){$("error").style.display="block";return}await openDash()}
async function openDash(){let r=await fetch("/api/admin/data");if(!r.ok)return;data=await r.json();$("login").style.display="none";$("dash").style.display="block";let p=data.pharmacy;name.value=p.name;license.value=p.license;holder.value=p.holder;address.value=p.address;pharmacist.value=p.pharmacist;registration.value=p.registration;rows.innerHTML="";data.medicines.forEach(addRow)}
function addRow(m={}){let vals=[m.name||"",m.generic_name||"",m.manufacturer||"",m.stock||"In Stock",m.purchase_price||"",m.consumer_price||""];let r=document.createElement("div");r.className="row";vals.forEach(v=>{let x=document.createElement("input");x.value=v;r.appendChild(x)});let b=document.createElement("button");b.className="btn danger";b.textContent="Remove";b.onclick=()=>r.remove();r.appendChild(b);rows.appendChild(r)}
async function save(){let medicines=[...document.querySelectorAll(".row")].map(r=>{let x=r.querySelectorAll("input");return{name:x[0].value,generic_name:x[1].value,manufacturer:x[2].value,stock:x[3].value,purchase_price:x[4].value,consumer_price:x[5].value}});let r=await fetch("/api/admin/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,license:license.value,holder:holder.value,address:address.value,pharmacist:pharmacist.value,registration:registration.value,medicines})});if(r.ok){$("ok").style.display="inline";setTimeout(()=>$("ok").style.display="none",2500)}else alert("Save failed")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
fetch("/api/me").then(r=>r.json()).then(x=>{if(x.authenticated)openDash()});
</script></body></html>
